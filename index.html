<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="taste">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>taste archive</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;
  --bg2:#f7f7f7;
  --bg3:#eeeeee;
  --text:#111111;
  --text2:#555555;
  --text3:#aaaaaa;
  --border:rgba(0,0,0,.07);
  --border2:rgba(0,0,0,.12);
  --accent:#111111;
  --r:14px;--r2:10px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* ── HEADER ── */
header{height:52px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:.5px solid var(--border);gap:10px}
.logo-wrap{display:flex;align-items:center;gap:12px}
.hdr-center{display:flex;gap:2px;background:var(--bg2);border-radius:20px;padding:3px;flex-shrink:0}
.logo-icon{display:flex;align-items:center;flex-shrink:0;pointer-events:none}
.logo-mark{display:flex;align-items:center;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:22px;color:#111;position:relative;letter-spacing:-.5px;pointer-events:none}
.logo-mark-dot{width:6px;height:6px;border-radius:50%;background:#111;margin-left:2px;margin-top:-10px;pointer-events:none}

.logo-dot{color:var(--text)}
.view-toggle{display:flex;gap:2px;background:var(--bg2);border-radius:20px;padding:3px}
.vt-btn{font-size:13px;font-weight:400;padding:4px 12px;border-radius:20px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.vt-btn.on{background:var(--text);color:#fff;font-weight:500}
.hdr-r{display:flex;align-items:center;gap:8px}
.stat-chips{display:flex;gap:10px;font-size:12px;color:var(--text3)}
.stat-chips b{color:var(--text);font-weight:600}
.icon-trigger{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.icon-trigger svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.share-trigger{font-size:13px;font-weight:500;font-family:inherit;padding:6px 16px;border-radius:20px;border:none;background:var(--text);color:#fff;cursor:pointer}

/* ── NAV ── */
nav{display:flex;padding:12px 20px;overflow-x:auto;flex-shrink:0;gap:6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nt{font-size:14px;font-weight:400;padding:7px 16px;color:var(--text3);cursor:pointer;border:none;background:var(--bg2);border-radius:20px;white-space:nowrap;transition:all .15s;font-family:inherit;letter-spacing:-.2px}
.nt.on{color:#fff;background:var(--text);font-weight:500}

/* ── LAYOUT ── */
.main{display:flex;flex:1;overflow:hidden}
.pane{flex:1;padding:16px 20px 30px;overflow-y:auto}

/* ── QUICK ADD ── */
.quick-add{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:14px 16px;background:var(--bg2);border-radius:var(--r);border:1.5px solid transparent;transition:border-color .15s}
.quick-add:focus-within{border-color:var(--text);background:#fff}
.qa-input{flex:1;font-size:15px;border:none;background:transparent;outline:none;font-family:inherit;color:var(--text)}
.qa-input::placeholder{color:var(--text3)}
.qa-status{display:flex;gap:4px;flex-shrink:0;flex-wrap:nowrap}
.qa-s{font-size:12px;padding:5px 10px;border-radius:20px;border:.5px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;font-family:inherit;transition:all .1s;white-space:nowrap;flex-shrink:0}
.qa-s.on{background:var(--text);color:#fff;border-color:var(--text)}

/* ── TOOLBAR ── */
.tb{display:flex;align-items:center;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.tb-l{flex:1;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tc{font-size:13px;color:var(--text3);margin-right:2px}
.sb{font-size:13px;padding:5px 12px;border-radius:20px;border:none;background:var(--bg2);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .1s}
.sb.on{background:var(--text);color:#fff}
.fc{font-size:13px;padding:5px 12px;border-radius:20px;border:none;background:var(--bg2);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .1s}
.fc.on{background:var(--text);color:#fff}

/* ── BOOK ── */
.shelf-wrap{background:var(--bg2);border-radius:var(--r);padding:16px 16px 10px;border-bottom:3px solid var(--bg3)}
.shelf{display:flex;align-items:flex-end;gap:4px;min-height:88px;flex-wrap:wrap}
.spine{width:16px;border-radius:3px 3px 0 0;cursor:pointer;transition:transform .18s;flex-shrink:0}
.spine:hover{transform:translateY(-8px)}
.spine:active{transform:translateY(-6px)}
.spine.wish{opacity:.2}.spine.reading{opacity:.55}
.spine.empty{background:var(--bg3)!important;border:1px dashed var(--border2);opacity:.4}
.shelf-hint{font-size:13px;color:var(--text3);margin-top:8px}
.empty-shelf{display:flex;align-items:flex-end;gap:4px;min-height:88px;flex-wrap:wrap;opacity:.18;pointer-events:none}
.empty-cta{margin-top:18px;text-align:center;color:var(--text3);font-size:14px;line-height:1.7}
.empty-cta b{color:var(--text2);font-weight:500}

/* ── FILM ── */
.film-rail{display:flex;gap:2px;margin-bottom:10px;overflow:hidden;height:5px}
.film-hole{width:9px;height:5px;border-radius:1px;background:var(--bg2);flex-shrink:0}
.poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.poster{aspect-ratio:2/3;border-radius:var(--r2);cursor:pointer;position:relative;overflow:hidden;transition:transform .18s;display:flex;flex-direction:column;justify-content:flex-end}
.poster:hover{transform:scale(1.04)}
.poster:active{transform:scale(.98)}
.poster-body{padding:8px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent 65%)}
.poster-t{font-size:12px;font-weight:500;color:#fff;line-height:1.3}
.poster-d{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}
.poster.wish{opacity:.25}.poster.reading{opacity:.65}
.poster-empty{aspect-ratio:2/3;border-radius:var(--r2);border:1.5px dashed var(--border2);background:var(--bg2)}

/* ── MUSIC ── */
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:10px}
.album{aspect-ratio:1;border-radius:var(--r2);cursor:pointer;position:relative;overflow:hidden;transition:transform .18s;display:flex;align-items:flex-end}
.album:hover{transform:scale(1.05)}
.album:active{transform:scale(.97)}
.album-body{padding:6px;width:100%;background:linear-gradient(to top,rgba(0,0,0,.68),transparent)}
.album-t{font-size:11px;font-weight:500;color:#fff;line-height:1.2}
.album-a{font-size:10px;color:rgba(255,255,255,.5);margin-top:1px}
.album.wish{opacity:.25}.album.reading{opacity:.6}
.album-empty{aspect-ratio:1;border-radius:var(--r2);border:1.5px dashed var(--border2);background:var(--bg2)}
.vr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;border:5px solid rgba(0,0,0,.2);opacity:0;transition:opacity .18s;pointer-events:none}
.album:hover .vr{opacity:1}

/* ── FASHION ── */
.fashion-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.masonry{columns:2;column-gap:10px}
.pin{break-inside:avoid;margin-bottom:10px;position:relative;cursor:pointer;border-radius:var(--r2);overflow:hidden;background:var(--bg2)}
.pin img{width:100%;display:block;border-radius:var(--r2)}
.pin-ph{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--bg2)}
.pin-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 55%);opacity:0;transition:opacity .18s;border-radius:var(--r2);display:flex;align-items:flex-end;padding:10px}
.pin:hover .pin-ov,.pin:active .pin-ov{opacity:1}
.pin-meta{color:#fff;font-size:12px;font-weight:500}
.pin-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.pin-tag{font-size:10px;background:rgba(255,255,255,.2);padding:2px 7px;border-radius:10px;color:#fff}
.pin.wish{opacity:.65}

/* ── STATUS VIEW ── */
.sv-wrap{display:flex;flex-direction:column;gap:22px}
.sv-section-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sv-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sv-section-title{font-size:15px;font-weight:600;letter-spacing:-.3px}
.sv-section-count{font-size:13px;color:var(--text3)}
.sv-items{display:flex;flex-direction:column;gap:5px}
.sv-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border-radius:var(--r2);cursor:pointer;transition:background .12s;-webkit-tap-highlight-color:transparent}
.sv-item:active{background:var(--bg3)}
.sv-item-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sv-item-body{flex:1;min-width:0}
.sv-item-title{font-size:15px;color:var(--text);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-item-sub{font-size:12px;color:var(--text3);margin-top:2px}
.sv-cat-chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg3);color:var(--text3);flex-shrink:0}
.sv-empty{font-size:14px;color:var(--text3);padding:16px;text-align:center}
.sv-tl-item{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:.5px solid var(--border)}
.sv-tl-item:last-child{border-bottom:none}
.sv-tl-date{font-size:12px;color:var(--text3);width:52px;flex-shrink:0;padding-top:2px}
.sv-tl-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.sv-tl-body{flex:1;min-width:0}
.sv-tl-title{font-size:15px;color:var(--text);cursor:pointer}
.sv-tl-meta{font-size:12px;color:var(--text3);margin-top:2px}
.sv-note-item{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;background:var(--bg2);border-radius:var(--r2);transition:background .12s}
.sv-note-item:active{background:var(--bg3)}
.sv-note-accent{width:3px;border-radius:2px;align-self:stretch;min-height:18px;flex-shrink:0;background:var(--text3)}
.sv-note-text{font-size:14px;color:var(--text);line-height:1.5;flex:1;min-width:0}
.sv-note-check{width:28px;height:28px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0;-webkit-tap-highlight-color:transparent}
.sv-note-check svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ── NOTE ── */
.note-shell{display:flex;flex-direction:column;gap:0;height:100%}
.note-overview{display:grid;grid-template-columns:1fr 1fr;border-radius:var(--r);overflow:hidden;margin-bottom:16px;border:.5px solid var(--border)}
.note-group-card{background:var(--bg2);padding:18px 20px;cursor:pointer;transition:background .12s;position:relative;border:.5px solid var(--border)}
.note-group-card:active{background:var(--bg3)}
.ngc-title{font-size:15px;font-weight:600;letter-spacing:-.3px;margin-bottom:4px}
.ngc-count{font-size:13px;color:var(--text3)}
.note-group-all{grid-column:1/-1;padding:16px 20px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:.5px solid var(--border);transition:background .12s}
.note-group-all:active{background:var(--bg3)}
.nga-title{font-size:15px;font-weight:600;letter-spacing:-.3px}
.nga-count{font-size:13px;color:var(--text3)}
.note-compose{flex-shrink:0;margin-bottom:14px}
.note-compose-box{background:var(--bg2);border-radius:var(--r);padding:14px 16px;border:1.5px solid transparent;transition:border-color .15s}
.note-compose-box:focus-within{border-color:var(--text);background:#fff}
.note-textarea{width:100%;font-size:15px;font-family:inherit;border:none;background:transparent;outline:none;resize:none;color:var(--text);line-height:1.55;max-height:100px;min-height:22px;overflow-y:auto}
.note-textarea::placeholder{color:var(--text3)}
.note-meta-row{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.note-label-btn{font-size:13px;padding:5px 12px;border-radius:20px;border:none;background:var(--bg3);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .1s}
.note-label-btn:active{background:var(--bg3)}
.note-label-btn.sel{background:var(--text);color:#fff;font-weight:500}
.note-send-btn{margin-left:auto;font-size:13px;font-weight:500;font-family:inherit;padding:6px 16px;border-radius:20px;border:none;background:var(--text);color:#fff;cursor:pointer}
.note-filter-bar{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.note-search-wrap{flex:1;min-width:130px;display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:20px;padding:8px 14px;border:1.5px solid transparent}
.note-search-wrap:focus-within{border-color:var(--text)}
.note-search-wrap svg{width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.note-search{flex:1;font-size:14px;border:none;background:transparent;outline:none;font-family:inherit;color:var(--text)}
.note-search::placeholder{color:var(--text3)}
.nlf{font-size:13px;padding:5px 12px;border-radius:20px;border:none;background:var(--bg2);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .1s}
.nlf.on{background:var(--text);color:#fff}

/* ── TODO ── */
.todo-list{display:flex;flex-direction:column}
.todo-section-lbl{font-size:17px;font-weight:700;letter-spacing:-.5px;padding:14px 0 10px;display:flex;align-items:baseline;gap:8px}
.todo-section-lbl:first-child{padding-top:0}
.todo-section-lbl span{font-size:13px;font-weight:400;color:var(--text3)}
.todo-item{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:.5px solid var(--border);-webkit-tap-highlight-color:transparent}
.todo-item:last-child{border-bottom:none}
.todo-item.done-item{opacity:.35}
.todo-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bg3);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;background:transparent}
.todo-check.checked{background:var(--text);border-color:var(--text)}
.todo-check svg{display:none;width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.todo-check.checked svg{display:block}
.todo-text{flex:1;font-size:15px;color:var(--text);line-height:1.45;letter-spacing:-.2px}
.todo-item.done-item .todo-text{text-decoration:line-through;color:var(--text3)}
.todo-del{width:28px;height:28px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.4}
.todo-del svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ── PLACE ── */
.place-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.place-card{background:var(--bg2);border-radius:var(--r);padding:16px;cursor:pointer;transition:background .12s;position:relative;-webkit-tap-highlight-color:transparent}
.place-card:active{background:var(--bg3)}
.place-card.done-card{opacity:.38}
.place-emoji{font-size:24px;margin-bottom:10px;display:block}
.place-title{font-size:14px;font-weight:500;color:var(--text);letter-spacing:-.2px;line-height:1.4}
.place-sub-tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg3);color:var(--text3);margin-top:8px}
.place-check-btn{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center}
.place-check-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ── SHOP ── */
.shop-list{display:flex;flex-direction:column;gap:4px}
.shop-item{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--bg2);border-radius:var(--r2);cursor:pointer;transition:background .12s;-webkit-tap-highlight-color:transparent}
.shop-item:active{background:var(--bg3)}
.shop-item.done-card{opacity:.35}
.shop-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--text)}
.shop-text{flex:1;font-size:15px;color:var(--text)}
.shop-item.done-card .shop-text{text-decoration:line-through;color:var(--text3)}
.shop-check{width:30px;height:30px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0}
.shop-check svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ── LINK ── */
.link-list{display:flex;flex-direction:column;gap:6px}
.link-card{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--bg2);border-radius:var(--r2);cursor:pointer;transition:background .12s;text-decoration:none;-webkit-tap-highlight-color:transparent}
.link-card:active{background:var(--bg3)}
.link-icon{width:32px;height:32px;border-radius:9px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.link-body{flex:1;min-width:0}
.link-title{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-url{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-del{width:28px;height:28px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.4}
.link-del svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ── MEMO ── */
.memo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.memo-card{background:var(--bg2);border-radius:var(--r);padding:16px;cursor:pointer;transition:background .12s;position:relative;min-height:88px}
.memo-card:active{background:var(--bg3)}
.memo-text{font-size:14px;color:var(--text);line-height:1.6;word-break:break-word}
.memo-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.memo-date{font-size:12px;color:var(--text3)}
.memo-del{width:24px;height:24px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.5}
.memo-del svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

.note-empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;line-height:1.7}
.note-empty-icon{font-size:32px;margin-bottom:10px;opacity:.35}
.na-move{font-size:12px;color:var(--text);background:var(--bg3);border:none;padding:3px 10px;border-radius:20px;cursor:pointer;font-family:inherit}
.sub-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.sub-tag{font-size:13px;padding:5px 12px;border-radius:20px;border:none;background:var(--bg2);color:var(--text2);cursor:pointer;font-family:inherit}
.sub-tag.on{background:var(--text);color:#fff}

/* ── YEAR ── */
.year-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.yk{background:var(--bg2);border-radius:var(--r);padding:18px}
.yk-lbl{font-size:12px;color:var(--text3);margin-bottom:6px}
.yk-val{font-size:34px;font-weight:700;color:var(--text);letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1}
.yk-sub{font-size:12px;color:var(--text3);margin-top:4px}
.year-bar-card{background:var(--bg2);border-radius:var(--r);padding:18px;margin-bottom:12px}
.ybc-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:14px}
.br-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.br-lbl{font-size:13px;color:var(--text3);width:36px;flex-shrink:0}
.br-track{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.br-fill{height:100%;border-radius:3px;background:var(--text);transition:width .65s cubic-bezier(.4,0,.2,1)}
.br-n{font-size:12px;color:var(--text2);width:20px;text-align:right}
.hm-card{background:var(--bg2);border-radius:var(--r);padding:18px}
.hm-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:12px}
.heatmap{display:flex;flex-wrap:wrap;gap:2px}
.hcell{width:13px;height:13px;border-radius:3px;background:var(--bg3)}
.hcell.h1{background:#c8c8c8}
.hcell.h2{background:var(--text)}

/* ── DETAIL PANEL ── */
.detail-panel{width:260px;border-left:.5px solid var(--border);overflow-y:auto;display:none;flex-direction:column;flex-shrink:0;background:var(--bg)}
.detail-panel.open{display:flex}
.dp-top{padding:14px 16px 0;display:flex;align-items:center;justify-content:flex-end}
.dp-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--bg2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dp-close svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.dp-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.dp-preview{width:100%;aspect-ratio:1;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden;background:var(--bg2)}
.dp-preview img{width:100%;height:100%;object-fit:cover;border-radius:var(--r)}
.dp-title{font-size:17px;font-weight:600;color:var(--text);letter-spacing:-.3px;line-height:1.3;cursor:text;border:1.5px solid transparent;border-radius:6px;padding:2px 5px;transition:border-color .1s;word-break:break-all}
.dp-title:focus{outline:none;border-color:var(--text)}
.dp-author{font-size:14px;color:var(--text3);cursor:text;border:1.5px solid transparent;border-radius:5px;padding:1px 5px;transition:border-color .1s}
.dp-author:focus{outline:none;border-color:var(--text)}
.dp-review-txt{font-size:14px;color:var(--text2);line-height:1.6;cursor:text;border:1.5px solid transparent;border-radius:6px;padding:5px;min-height:52px;transition:border-color .1s;font-family:inherit;white-space:pre-wrap;word-break:break-all}
.dp-review-txt:focus{outline:none;border-color:var(--text)}
.dp-review-ph{color:var(--text3);font-style:italic}
.dp-field-lbl{font-size:11px;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.status-toggle{display:flex;gap:4px}
.st-btn{font-size:13px;padding:5px 12px;border-radius:20px;border:none;background:var(--bg2);color:var(--text3);cursor:pointer;font-family:inherit;transition:all .12s}
.st-btn.on-done{background:#111;color:#fff;font-weight:500}
.st-btn.on-reading{background:#f0f0f0;color:#111;font-weight:500}
.st-btn.on-wish{background:#f0f0f0;color:#111;font-weight:500}
.stars-inline{display:flex;gap:4px;cursor:pointer}
.si{font-size:22px;transition:color .08s;user-select:none}
.color-swatches{display:flex;gap:6px;flex-wrap:wrap}
.csw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s;flex-shrink:0}
.csw.sel{border-color:var(--text);transform:scale(1.22)}
.tags-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dtag{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--bg2);color:var(--text2);display:inline-flex;align-items:center;gap:4px;border:.5px solid var(--border)}
.dtag-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:0;line-height:1}
.tag-add-btn{font-size:12px;padding:3px 10px;border-radius:20px;border:.5px dashed var(--border2);color:var(--text3);background:transparent;cursor:pointer;font-family:inherit}
.tag-inp{font-size:12px;padding:3px 9px;border-radius:20px;border:1.5px solid var(--text);outline:none;background:#fff;color:var(--text);font-family:inherit;width:80px}
.tag-inp-wrap{position:relative;display:inline-block}
.tag-suggest{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.12);min-width:120px;z-index:100;overflow:hidden;border:.5px solid var(--border)}
.tag-suggest-item{padding:9px 14px;font-size:14px;color:var(--text);cursor:pointer;transition:background .1s}
.tag-suggest-item:hover,.tag-suggest-item.active{background:var(--bg2)}
.tag-suggest-item mark{background:transparent;color:var(--text);font-weight:600}
.dp-date-inp{font-size:14px;color:var(--text3);border:none;background:transparent;outline:none;cursor:pointer;font-family:inherit;padding:0}
.divider{height:.5px;background:var(--border);margin:2px 0}
.dp-del{font-size:13px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:inherit;padding:0;margin-top:auto}
.complete-btn{width:100%;padding:10px;border-radius:var(--r2);border:none;background:var(--text);color:#fff;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;transition:opacity .12s;display:flex;align-items:center;justify-content:center;gap:5px}
.complete-btn svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ── SEARCH ── */
.gsearch-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(12px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:80px}
.gsearch-overlay.open{display:flex}
.gsearch-box{background:#fff;border-radius:var(--r);width:90vw;max-width:560px;box-shadow:0 24px 64px rgba(0,0,0,.18);overflow:hidden}
.gsearch-input-row{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:.5px solid var(--border)}
.gsearch-input-row svg{width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.gsearch-inp{flex:1;font-size:16px;border:none;outline:none;font-family:inherit;color:var(--text);background:transparent}
.gsearch-inp::placeholder{color:var(--text3)}
.gsearch-esc{font-size:12px;color:var(--text3);background:var(--bg2);padding:3px 9px;border-radius:6px;border:.5px solid var(--border2);cursor:pointer;font-family:inherit}
.gsearch-results{max-height:60vh;overflow-y:auto;padding:8px}
.gsearch-section-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 5px}
.gsearch-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r2);cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent}
.gsearch-item:active{background:var(--bg2)}
.gsearch-item-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.gsearch-item-title{font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsearch-item-title mark{background:#ffe066;border-radius:2px;padding:0 1px}
.gsearch-item-sub{font-size:12px;color:var(--text3);margin-top:2px}
.gsearch-item-cat{font-size:11px;color:var(--text3);background:var(--bg2);padding:3px 9px;border-radius:20px;flex-shrink:0}
.gsearch-empty{padding:32px;text-align:center;color:var(--text3);font-size:15px}

/* ── SHARE / MOVE ── */
.share-overlay,.move-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(12px);z-index:200;display:none;align-items:flex-end;justify-content:center;padding:0}
.share-overlay.open,.move-modal-overlay.open{display:flex}
.share-modal,.move-modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:100%;box-shadow:0 -8px 40px rgba(0,0,0,.12);overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
.share-header,.move-modal-hdr{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--border)}
.share-header h3,.move-modal-hdr span{font-size:16px;font-weight:600;letter-spacing:-.3px}
.share-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.share-close svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.share-card-wrap{padding:20px;background:var(--bg2)}
.share-card{background:#111;border-radius:var(--r);padding:28px;color:#fff}
.share-card-logo{font-size:13px;font-weight:600;opacity:.45;margin-bottom:20px}
.share-card-year{font-size:12px;opacity:.35;margin-bottom:16px}
.share-card-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.share-stat{background:rgba(255,255,255,.08);border-radius:10px;padding:16px}
.share-stat-n{font-size:30px;font-weight:700;letter-spacing:-.6px}
.share-stat-l{font-size:11px;opacity:.45;margin-top:2px}
.share-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.share-bar-l{font-size:11px;opacity:.4;width:30px;flex-shrink:0}
.share-bar-t{flex:1;height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.share-bar-f{height:100%;border-radius:2px;background:rgba(255,255,255,.7)}
.share-bar-n{font-size:11px;opacity:.4;width:16px;text-align:right}
.share-actions{padding:16px 20px 20px;display:flex;gap:10px}
.share-btn{flex:1;padding:12px;border-radius:var(--r2);font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;border:none}
.share-btn-dl{background:var(--text);color:#fff}
.share-btn-cancel{background:var(--bg2);color:var(--text2)}
.move-modal-txt{padding:12px 20px;font-size:14px;color:var(--text2);line-height:1.5;border-bottom:.5px solid var(--border);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.move-modal-body{padding:10px 12px}
.move-opt{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:var(--r2);cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent}
.move-opt:active{background:var(--bg2)}
.move-opt-icon{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.move-opt-lbl{font-size:15px;color:var(--text)}
.move-opt-sub{font-size:12px;color:var(--text3);margin-top:1px}
.move-cancel{width:100%;padding:12px;border-radius:var(--r2);font-size:15px;font-weight:400;font-family:inherit;background:var(--bg2);border:none;color:var(--text2);cursor:pointer;margin-top:4px}

/* ── MOBILE ── */
@media(max-width:680px){

  nav{padding:10px 18px 12px}
  .pane{padding:14px 18px 30px}
  .detail-panel{
    position:fixed;bottom:0;left:0;right:0;width:100%;height:80vh;
    border-left:none;border-top:.5px solid var(--border);
    border-radius:20px 20px 0 0;z-index:60;background:var(--bg);
    display:flex;flex-direction:column;
    box-shadow:0 -8px 40px rgba(0,0,0,.1);
    transform:translateY(110%);
    transition:transform .32s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  .detail-panel.open{transform:translateY(0);pointer-events:all}
  .dp-handle{width:36px;height:4px;border-radius:2px;background:var(--bg3);margin:10px auto 0;flex-shrink:0}
  .dp-top{padding:8px 18px 0}
  .dp-body{padding:14px 18px 24px;overflow-y:auto}
  .masonry{columns:2}

}
@media(min-width:681px){
  .dp-handle{display:none}
  .detail-panel{position:static;width:260px;height:auto;transform:none!important;transition:none;pointer-events:all;border-radius:0;box-shadow:none;border-left:.5px solid var(--border);border-top:none;display:none}
  .detail-panel.open{display:flex}
}

/* ── ANIM ── */
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease}
@keyframes spineIn{from{transform:translateY(-18px) scaleY(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes posterIn{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
@keyframes albumIn{from{transform:scale(.72) rotate(-5deg);opacity:0}to{transform:none;opacity:1}}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spine-new{animation:spineIn .36s cubic-bezier(.34,1.56,.64,1)}
.poster-new{animation:posterIn .3s cubic-bezier(.34,1.4,.64,1)}
.album-new{animation:albumIn .32s cubic-bezier(.34,1.5,.64,1)}
.count-up{animation:countUp .52s ease both}
</style>
</head>
<body>
<header>
  <div class="logo-icon"><div class="logo-mark">t<span class="logo-mark-dot"></span></div></div>
  <div class="hdr-center" id="view-toggle">
    <button class="vt-btn on" data-vt="cat">카테고리</button>
    <button class="vt-btn" data-vt="status">상태별</button>
  </div>
  <div class="hdr-r">
    <div class="stat-chips" id="stat-chips"></div>
    <button class="icon-trigger" id="search-trigger" title="검색 (/)">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="14" y2="14"/></svg>
    </button>
  </div>
</header>

<nav id="nav">
  <button class="nt on" data-tab="book">책</button>
  <button class="nt" data-tab="film">영화</button>
  <button class="nt" data-tab="music">음악</button>
  <button class="nt" data-tab="fashion">패션</button>
  <button class="nt" data-tab="note">메모</button>
  <button class="nt" data-tab="year">연간</button>
</nav>

<div class="main">
  <div class="pane" id="pane"></div>
  <div class="detail-panel" id="detail-panel">
    <div class="dp-handle"></div>
    <div class="dp-top">
      <button class="dp-close" id="dp-close">
        <svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
      </button>
    </div>
    <div class="dp-body" id="dp-body"></div>
  </div>
</div>



<!-- Global Search -->
<div class="gsearch-overlay" id="gsearch-overlay">
  <div class="gsearch-box">
    <div class="gsearch-input-row">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="14" y2="14"/></svg>
      <input class="gsearch-inp" id="gsearch-inp" placeholder="책, 영화, 음악, 메모 검색…" autocomplete="off">
      <button class="gsearch-esc" id="gsearch-esc">ESC</button>
    </div>
    <div class="gsearch-results" id="gsearch-results"></div>
  </div>
</div>

<!-- Share -->
<div class="share-overlay" id="share-overlay">
  <div class="share-modal">
    <div class="share-header">
      <h3>연간 리뷰 공유</h3>
      <button class="share-close" id="share-close"><svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg></button>
    </div>
    <div class="share-card-wrap"><div class="share-card" id="share-card"></div></div>
    <div class="share-actions">
      <button class="share-btn share-btn-cancel" id="share-cancel">취소</button>
      <button class="share-btn share-btn-dl" id="share-dl">저장</button>
    </div>
  </div>
</div>

<!-- Move to Archive -->
<div class="move-modal-overlay" id="move-overlay">
  <div class="move-modal">
    <div class="move-modal-hdr"><span>아카이브로 이동</span><button class="share-close" id="move-close"><svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg></button></div>
    <div class="move-modal-txt" id="move-txt"></div>
    <div class="move-modal-body">
      <div class="move-opt" data-move="book"><div class="move-opt-icon">📚</div><div><div class="move-opt-lbl">책</div><div class="move-opt-sub">위시리스트로</div></div></div>
      <div class="move-opt" data-move="film"><div class="move-opt-icon">🎬</div><div><div class="move-opt-lbl">영화</div><div class="move-opt-sub">위시리스트로</div></div></div>
      <div class="move-opt" data-move="music"><div class="move-opt-icon">🎵</div><div><div class="move-opt-lbl">음악</div><div class="move-opt-sub">위시리스트로</div></div></div>
      <div class="move-opt" data-move="fashion"><div class="move-opt-icon">👗</div><div><div class="move-opt-lbl">패션</div><div class="move-opt-sub">위시리스트로</div></div></div>
      <button class="move-cancel" id="move-cancel-btn">취소</button>
    </div>
  </div>
</div>

<script>
const COLORS=['#FF453A','#FF9F0A','#FFD60A','#30D158','#32ADE6','#0A84FF','#5E5CE6','#BF5AF2','#FF375F','#8E8E93','#3A3A3C'];
const SL={done:'완료',reading:'진행',wish:'위시'};
const DEF_EMOJI={book:'📖',film:'🎬',music:'🎵',fashion:'📷'};
const HDH={book:[48,52,54,56,58,60,62]};
const CAT_NAME={book:'책',film:'영화',music:'음악',fashion:'패션'};
const CAT_EMOJI={book:'📚',film:'🎬',music:'🎵',fashion:'👗'};

// NOTE LABELS with colors and sub-tags
const NOTE_LABELS=[
  {id:'place',  name:'가고싶은곳', color:'#30D158', icon:'📍', sub:['카페','맛집','기타']},
  {id:'buy',    name:'사고싶은것', color:'#FF9F0A', icon:'🛍', sub:[]},
  {id:'todo',   name:'할일',       color:'#FF453A', icon:'✓',  sub:[]},
  {id:'memo',   name:'메모',       color:'#8E8E93', icon:'📝', sub:[]},
  {id:'link',   name:'링크',       color:'#0A84FF', icon:'🔗', sub:[]},
];

let items=[];
let notes=[];
let nid=1,nnid=1;
let tab='book',sortMode='date',fashFilter='전체',selStatus='wish';
let detailId=null,moveNoteId=null,newItemId=null;
let viewMode='cat';
let noteView='feed'; // 'feed' | 'overview' | label id
let noteSub='전체'; // sub-tag filter
let noteSearch='';

const $=id=>document.getElementById(id);
function dStr(d){return d?new Date(d+'T12:00').toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'}):''}
function dStrShort(d){return d?new Date(d+'T12:00').toLocaleDateString('ko-KR',{month:'short',day:'numeric'}):''}
function hexDk(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgb(${Math.round(r*(1-a))},${Math.round(g*(1-a))},${Math.round(b*(1-a))})`}

function getSorted(cat){
  let a=items.filter(i=>i.cat===cat);
  if(sortMode==='date') a.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  else if(sortMode==='stars') a.sort((a,b)=>b.stars-a.stars);
  else a.sort((a,b)=>['done','reading','wish'].indexOf(a.status)-['done','reading','wish'].indexOf(b.status));
  return a;
}

/* ── STATS ── */
function renderStats(){
  const done=items.filter(i=>i.status==='done').length;
  const rd=items.filter(i=>i.status==='reading').length;
  const wi=items.filter(i=>i.status==='wish').length;
  $('stat-chips').innerHTML=`<span><b>${done}</b> 완료</span><span><b>${rd}</b> 진행</span><span><b>${wi}</b> 위시</span>`;
}

/* ── QUICK ADD + TOOLBAR ── */
function qaHtml(cat){
  if(cat==='note'||cat==='year') return '';
  const ph={book:'책 제목…',film:'영화 제목…',music:'앨범 / 곡…',fashion:'아이템…'}[cat];
  return `<div class="quick-add">
    <input class="qa-input" id="qa-input" placeholder="${ph}">
    <div class="qa-status">
      <button class="qa-s${selStatus==='done'?' on':''}" data-qs="done">완료</button>
      <button class="qa-s${selStatus==='reading'?' on':''}" data-qs="reading">진행</button>
      <button class="qa-s${selStatus==='wish'?' on':''}" data-qs="wish">위시</button>
    </div>
  </div>`;
}
function tbHtml(cat){
  if(cat==='note'||cat==='year') return '';
  const cnt=items.filter(i=>i.cat===cat).length;
  const catN=CAT_NAME[cat];
  const sorts=cat!=='fashion'?`
    <button class="sb${sortMode==='date'?' on':''}" data-sort="date">날짜</button>
    <button class="sb${sortMode==='stars'?' on':''}" data-sort="stars">별점</button>
    <button class="sb${sortMode==='status'?' on':''}" data-sort="status">상태</button>`:'';
  return `<div class="tb"><div class="tb-l"><span class="tc">${catN} ${cnt}</span>${sorts}</div></div>`;
}

      ${todoItems(pending)||'<div style="font-size:12px;color:var(--text3);padding:8px 4px">모두 완료했어요 🎉</div>'}
      ${done.length?`<div class="todo-section-lbl" style="margin-top:8px;color:var(--text3)">완료됨 ${done.length}</div>${todoItems(done)}`:''}
    </div>`;
  } else if(noteView==='place'){
    const subMap={'카페':'☕','맛집':'🍽','기타':'📍'};

    </div>`).join('')}${arr.filter(n=>n.done).map(n=>`<div class="place-card done-card" data-nid="${n.id}">
      <span class="place-emoji" style="opacity:.4">${subMap[n.sub]||'📍'}</span>

      </div>`;
    }).join('')}</div>`;
  } else if(noteView==='memo'){
    content=`<div class="memo-grid">${arr.filter(n=>!n.done).map(n=>`<div class="memo-card">

    ${content}

function getAllTags(){
  const s=new Set();
  items.forEach(it=>(it.tags||[]).forEach(t=>s.add(t)));
  return [...s];
}

function renderDetailTags(it){
  const row=$('dp-tags-row');if(!row)return;
  const chips=(it.tags||[]).map(t=>`<span class="dtag">${t}<button class="dtag-del" data-t="${t}">×</button></span>`).join('');
  row.innerHTML=chips+`<button class="tag-add-btn" id="tag-add-btn">+ 태그</button>`;
  row.querySelectorAll('.dtag-del').forEach(b=>{
    b.onclick=()=>{it.tags=(it.tags||[]).filter(x=>x!==b.dataset.t);renderDetailTags(it);if(tab==='fashion')render();};
  });
  $('tag-add-btn').onclick=function(){
    // 인풋 + 자동완성 wrapper
    const wrap=document.createElement('div');wrap.className='tag-inp-wrap';
    const inp=document.createElement('input');
    inp.className='tag-inp';inp.placeholder='태그명';
    const suggest=document.createElement('div');suggest.className='tag-suggest';suggest.style.display='none';
    wrap.appendChild(inp);wrap.appendChild(suggest);
    this.replaceWith(wrap);inp.focus();

    let activeIdx=-1;

    function updateSuggest(q){
      const all=getAllTags().filter(t=>!(it.tags||[]).includes(t));
      const matches=q?all.filter(t=>t.includes(q)):[];
      if(!matches.length){suggest.style.display='none';activeIdx=-1;return;}
      suggest.style.display='block';
            suggest.innerHTML=matches.map((t,i)=>{
        const qi=t.toLowerCase().indexOf(q.toLowerCase());
        const hl=qi>=0?t.slice(0,qi)+'<mark>'+t.slice(qi,qi+q.length)+'</mark>'+t.slice(qi+q.length):t;
        return '<div class="tag-suggest-item" data-st="'+t+'">'+hl+'</div>';
      }).join('');
      suggest.querySelectorAll('.tag-suggest-item').forEach((el,i)=>{
        el.onmousedown=e=>{e.preventDefault();addTag(el.dataset.st);};
      });
    }

    function addTag(v){
      if(v&&!(it.tags||[]).includes(v)){if(!it.tags)it.tags=[];it.tags.push(v);}
      renderDetailTags(it);if(tab==='fashion')render();
    }

    inp.addEventListener('input',()=>{activeIdx=-1;updateSuggest(inp.value.trim());});
    inp.addEventListener('keydown',e=>{
      const items2=[...suggest.querySelectorAll('.tag-suggest-item')];
      if(e.key==='ArrowDown'){e.preventDefault();activeIdx=Math.min(activeIdx+1,items2.length-1);items2.forEach((el,i)=>el.classList.toggle('active',i===activeIdx));}
      else if(e.key==='ArrowUp'){e.preventDefault();activeIdx=Math.max(activeIdx-1,0);items2.forEach((el,i)=>el.classList.toggle('active',i===activeIdx));}
      else if(e.key==='Enter'){
        e.preventDefault();
        const active=items2[activeIdx];
        addTag(active?active.dataset.st:inp.value.trim());
      }
      else if(e.key==='Escape'){renderDetailTags(it);}
    });
    inp.onblur=()=>{
      setTimeout(()=>{
        const v=inp.value.trim();
        if(v&&!(it.tags||[]).includes(v)){addTag(v);}else{renderDetailTags(it);}
      },150);
    };
  };
}

function openGSearch(){$('gsearch-overlay').classList.add('open');$('gsearch-inp').value='';$('gsearch-results').innerHTML='<div class="gsearch-empty">검색어를 입력하세요</div>';setTimeout(()=>$('gsearch-inp').focus(),50);}
function closeGSearch(){$('gsearch-overlay').classList.remove('open');}
function runSearch(q){
  const r=$('gsearch-results');if(!q.trim()){r.innerHTML='<div class="gsearch-empty">검색어를 입력하세요</div>';return;}
  const ql=q.toLowerCase();const hl=s=>s.replace(new RegExp('('+ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  const mi=items.filter(i=>i.title.toLowerCase().includes(ql)||(i.author||'').toLowerCase().includes(ql));
  const mn=notes.filter(n=>n.text.toLowerCase().includes(ql));
  if(!mi.length&&!mn.length){r.innerHTML='<div class="gsearch-empty">검색 결과가 없어요</div>';return;}
  let html='';
  if(mi.length){html+=`<div class="gsearch-section-lbl">아카이브</div>`;html+=mi.slice(0,8).map(it=>`<div class="gsearch-item" data-gid="${it.id}" data-gcat="${it.cat}"><div class="gsearch-item-icon" style="background:${it.color}18">${it.emoji||CAT_EMOJI[it.cat]}</div><div style="flex:1;min-width:0"><div class="gsearch-item-title">${hl(it.title)}</div><div class="gsearch-item-sub">${it.author?hl(it.author)+' · ':''}${CAT_NAME[it.cat]}</div></div><span class="gsearch-item-cat">${SL[it.status]}</span></div>`).join('');}
  if(mn.length){html+=`<div class="gsearch-section-lbl">메모</div>`;html+=mn.slice(0,5).map(n=>{const lbl=NOTE_LABELS.find(l=>l.id===n.label)||NOTE_LABELS[3];return`<div class="gsearch-item" data-gnid="${n.id}"><div class="gsearch-item-icon" style="background:rgba(0,0,0,.06);font-size:12px">📝</div><div style="flex:1;min-width:0"><div class="gsearch-item-title">${hl(n.text.slice(0,50))}</div></div><span class="gsearch-item-cat">${lbl.name}</span></div>`;}).join('');}
  r.innerHTML=html;
  r.querySelectorAll('[data-gid]').forEach(el=>{el.onclick=()=>{const id=parseInt(el.dataset.gid),cat=el.dataset.gcat;closeGSearch();tab=cat;document.querySelectorAll('.nt').forEach(x=>x.classList.remove('on'));document.querySelector(`.nt[data-tab="${cat}"]`)?.classList.add('on');viewMode='cat';document.querySelectorAll('.vt-btn').forEach(b=>b.classList.remove('on'));document.querySelector('.vt-btn[data-vt="cat"]')?.classList.add('on');render();setTimeout(()=>openDetail(id),80);};});
  r.querySelectorAll('[data-gnid]').forEach(el=>{el.onclick=()=>{const nid2=parseInt(el.dataset.gnid);closeGSearch();tab='note';document.querySelectorAll('.nt').forEach(x=>x.classList.remove('on'));document.querySelector('.nt[data-tab="note"]')?.classList.add('on');const n=notes.find(x=>x.id===nid2);noteView='feed';render();};});
}
$('search-trigger').onclick=openGSearch;
$('gsearch-esc').onclick=closeGSearch;
$('gsearch-overlay').onclick=e=>{if(e.target===$('gsearch-overlay'))closeGSearch();};
$('gsearch-inp').addEventListener('input',e=>runSearch(e.target.value));
$('gsearch-inp').addEventListener('keydown',e=>{if(e.key==='Escape')closeGSearch();});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();openGSearch();}});

function buildShareCard(){
  const cats=['book','film','music','fashion'];
  const dc=cats.map(c=>items.filter(i=>i.cat===c&&i.status==='done').length);
  const mx=Math.max(...dc,1);const td=items.filter(i=>i.status==='done').length;
  const rated=items.filter(i=>i.stars>0);const avg=rated.length?(rated.reduce((s,i)=>s+i.stars,0)/rated.length).toFixed(1):'-';
  const bars=cats.map((c,i)=>`<div class="share-bar-row"><div class="share-bar-l">${CAT_NAME[c]}</div><div class="share-bar-t"><div class="share-bar-f" style="width:${Math.round(dc[i]/mx*100)}%"></div></div><div class="share-bar-n">${dc[i]}</div></div>`).join('');
  $('share-card').innerHTML=`<div class="share-card-logo">taste<span>.</span>archive</div><div class="share-card-year">${new Date().getFullYear()}년 기록</div><div class="share-card-stats"><div class="share-stat"><div class="share-stat-n">${td}</div><div class="share-stat-l">완료</div></div><div class="share-stat"><div class="share-stat-n">${avg}</div><div class="share-stat-l">평균 별점</div></div></div>${bars}`;
}

  if(panel.classList.contains('open')&&!panel.contains(e.target)&&!e.target.closest('[data-id]')){
    closeDetail();
  }
});
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
